name: Worker Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number }}
  # Serialize deployment, deletion, and reopening for this PR.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  live-preview-verification:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: __WORKER_DIRECTORY__/package-lock.json
      - run: __INSTALL_COMMAND__
        working-directory: __WORKER_DIRECTORY__
      - name: Require the Worker Previews beta
        working-directory: __WORKER_DIRECTORY__
        run: test "$(npx wrangler --version)" = "4.127.1"
      - id: preview
        name: Create or update Preview
        working-directory: __WORKER_DIRECTORY__
        run: |
          set -o pipefail
          preview_name="$GITHUB_HEAD_REF"
          test "${#preview_name}" -le 63
          printf '%s' "$preview_name" | grep -Eq '^[a-z]{2,4}-[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*$'
          output="$(npx wrangler preview --config "__WRANGLER_CONFIG__" \
            --env "__WRANGLER_ENV__" --name "$preview_name" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s' "$output" | python3 -c 'import json,sys; s=sys.stdin.read(); i=s.find("{"); value,_=json.JSONDecoder().raw_decode(s[i:]); print(json.dumps(value))')"
          preview_url="$(printf '%s' "$json" | jq -er --arg suffix "$PREVIEW_HOST_SUFFIX" --arg branch "$preview_name" \
            '[.preview_urls[]?, .preview.urls[]?] | if $suffix == "" then .[0] else map(select(rtrimstr("/") == ("https://" + $branch + "." + $suffix)))[0] end')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_HOST_SUFFIX: __PREVIEW_HOST_SUFFIX__
      - id: probe
        name: Verify the live Preview
        run: |
          probe_url="${PREVIEW_URL%/}/__PROBE_PATH__"
          if ! status="$(curl --connect-timeout 10 --max-time 60 --retry 5 --retry-delay 3 \
            --show-error --silent --output /dev/null \
            --write-out '%{http_code}' "$probe_url")"; then status=000; fi
          verified=false
          [ "$status" = "__EXPECTED_STATUS__" ] && verified=true
          {
            echo "probe_url=$probe_url"
            echo "status=$status"
            echo "verified=$verified"
          } >> "$GITHUB_OUTPUT"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Comment Preview URL
        run: |
          marker='<!-- worker-preview -->'
          body="$marker
          Worker Preview: ${{ steps.preview.outputs.preview_url }}
          Live verification: ${{ steps.probe.outputs.verified }} — ${{ steps.probe.outputs.probe_url }} returned HTTP ${{ steps.probe.outputs.status }}"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --method PATCH --field body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --field body="$body" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Require live verification
        run: test '${{ steps.probe.outputs.verified }}' = true

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: __INSTALL_COMMAND__
        working-directory: __WORKER_DIRECTORY__
      - name: Delete Preview
        working-directory: __WORKER_DIRECTORY__
        run: |
          preview_name="$GITHUB_HEAD_REF"
          test "${#preview_name}" -le 63
          printf '%s' "$preview_name" | grep -Eq '^[a-z]{2,4}-[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*$'
          npx wrangler preview delete --config "__WRANGLER_CONFIG__" \
            --env "__WRANGLER_ENV__" --name "$preview_name" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
