name: vibecodereview
# Retired. Pull requests do not start this, and a manual dispatch has no pull
# request for the action to review, so the job does not run. The proof that a
# second model read the diff is ## Review in the description, or the same two
# lines in a pull request comment. pr-standards checks that.
on:
  workflow_dispatch:
concurrency:
  group: vibecodereview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  vibecodereview:
    # Retired. See the note at the top of this file.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: pooriaarab/vibecodereview@v1
        with:
          vibetrace_ingest_url: ${{ secrets.VIBETRACE_INGEST_URL }}
          vibetrace_ingest_token: ${{ secrets.VIBETRACE_INGEST_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_code_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          github_token: ${{ github.token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          moonshot_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}