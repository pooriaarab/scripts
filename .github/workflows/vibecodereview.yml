name: vibecodereview
on:
  pull_request:
    types: [opened, synchronize, review_requested]
    # VISION.md is what the council reads to judge whether every OTHER
    # pull request belongs here, and the markdown skip meant it was the
    # one file the council never saw. A later negative pattern re-includes
    # a path an earlier one ignored, so the rest of the markdown still skips.
    paths-ignore: ["**.md", "docs/**", "!VISION.md"]
concurrency:
  group: vibecodereview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  vibecodereview:
    # Only review the repo owner's own PRs (cost + injection guard on public repos).
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: pooriaarab/vibecodereview@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_code_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          github_token: ${{ github.token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          moonshot_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
